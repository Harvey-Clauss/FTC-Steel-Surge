name: README Version Bump

on:
  workflow_dispatch:
    inputs:
      commit_type:
        description: Select the type of update to apply to the README version
        required: true
        type: choice
        options:
          - bug-fix
          - minor-update
          - major-update

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7

      - name: Bump README version
        id: version
        env:
          COMMIT_TYPE: ${{ inputs.commit_type }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text()
          pattern = re.compile(
              r"(?m)^\*\*Version: (\d+)\.(\d+)\.(\d+)( — pre-release \(active development\))?\*\*$"
          )
          match = pattern.search(content)
          if match is None:
              raise SystemExit("Could not find the README version line.")

          major, minor, patch = map(int, match.group(1, 2, 3))
          commit_type = os.environ["COMMIT_TYPE"]
          if commit_type == "bug-fix":
              patch += 1
          elif commit_type == "minor-update":
              minor += 1
              patch = 0
          elif commit_type == "major-update":
              major += 1
              minor = 0
              patch = 0
          else:
              raise SystemExit(f"Unsupported commit type: {commit_type}")

          new_version = f"{major}.{minor}.{patch}"
          suffix = match.group(4) or ""
          updated_line = f"**Version: {new_version}{suffix}**"
          readme.write_text(content[:match.start()] + updated_line + content[match.end():])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"new_version={new_version}\n")
          print(f"Updated README version to {new_version}.")
          PY

      - name: Commit and push README version
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Run this workflow on a branch, not a tag." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "docs: bump README version to $NEW_VERSION"
          git push origin "$GITHUB_REF"
